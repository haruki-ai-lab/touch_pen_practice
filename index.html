<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>せんのぼうけん</title>
  <link rel="manifest" href="./manifest.json?v=10">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/styles.css?v=10">
</head>
<body>
  <div id="app"></div>
  <script defer src="./src/themes.js?v=10"></script>
  <script defer src="./src/courses.js?v=10"></script>
  <script defer src="./src/kana-courses.js?v=10"></script>
  <script defer src="./src/kanji-courses.js?v=10"></script>
  <script defer src="./src/app.js?v=10"></script>
  <script>
    if ("serviceWorker" in navigator) {
      const page = document.documentElement;
      page.dataset.pwaState = "registering";
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        page.dataset.pwaControlled = "true";
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => navigator.serviceWorker.ready)
          .then(() => {
            page.dataset.pwaState = "ready";
            page.dataset.pwaControlled = String(Boolean(navigator.serviceWorker.controller));
          })
          .catch(() => {
            page.dataset.pwaState = "error";
          });
      });
    }
  </script>
</body>
</html>
